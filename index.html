<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Personal Expense Tracker</h1>
        <p>Track your expenses and manage your spending.</p>
        <button type="button" id="theme-toggle">Switch to Dark Mode</button>
    </header>

    <main>

        <section id="expense-form-section">
            <h2>Add New Expense</h2>

            <form id="expense-form">
                <label for="description">Description:</label>
                <input
                    type="text"
                    id="description"
                    placeholder="e.g. Lunch, Bus Ticket"
                >
                <p class="error-message" id="description-error"></p>

                <label for="amount">Amount:</label>
                <input
                    type="number"
                    id="amount"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter amount"
                >
                <p class="error-message" id="amount-error"></p>

                <label for="category">Category:</label>
                <select id="category">
                    <option value="">Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <p class="error-message" id="category-error"></p>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section id="total-section">
            <h2>Total Expenses</h2>
            <p id="total-expenses">₦0.00</p>
        </section>

        <section id="expense-list-section">
            <h2>Expense List</h2>

            <p id="empty-message">No expenses added yet.</p>

            <div id="expense-list">
                <!-- JavaScript will display expenses here. -->
            </div>
        </section>

    </main>

</body>
</html>
